name: CI

# Runs on every pull request, and on main itself so a merge that goes in by any
# other route still reports. `npm run build` is the important one: it is the only
# step that type-checks, because Vite strips types without looking at them — which
# is how a type error once reached main while every story still passed.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and stories
    runs-on: ubuntu-latest
    # A hung step should fail in minutes, not sit there for six hours. The whole
    # job takes about a minute.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap steps first, so an ordinary mistake fails in seconds rather than
      # after the browser download.
      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # The story suite runs in real Chromium through Playwright, so the browser
      # has to be there. Only chromium: vite.config.ts configures no others.
      #
      # **Not `--with-deps`.** That flag shells out to apt-get, which hung for
      # 20+ minutes on a run where the plain download took seconds. The system
      # libraries it installs are already on the ubuntu-latest image, so it was
      # buying nothing and cost the only real flake this workflow has had.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run stories
        run: npm test
